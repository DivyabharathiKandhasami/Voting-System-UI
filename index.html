<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <title>New Registration</title>
</head>
<body>
  <div class="container p-4" style="width: 650px;" >
    <h2>User Registration Page</h2>
    <form id="registrationForm" >
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="dob">DOB</label>
        <input type="date" id="dob" name="dob" required>
      </div>
      <div class="form-group ">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone No</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
      </div>
      <div class="form-group">
        <label for="adhar">Aadhar Card No</label>
        <input type="text" id="adhar" name="adhar" placeholder="Enter last 4 digits" pattern="\d{4}" required>
      </div>
      <div class="form-group">
        <label for="voter">Voter ID</label>
        <input type="text" id="voter" name="voter" placeholder="Enter last 4 digits" pattern="\d{4}" required>
      </div>
      <div class="form-group">
        <label for="voterImage">Voter ID Image</label>
        <input type="file" id="voterImage" name="voterImage" accept="image/*" required>
      </div>
      <button type="submit" class="button fw-bold">Register button</button>
    </form>
  </div>
</body>
<script src="main.js"></script>
</html>
