<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Admin Page</title>

<body>
    <div class="container">
        <form id="form" class="form-container ">
            <i class="fa-solid fa-user-circle" id="server"></i>
            <h2>Admin Page!</h2>

    <div class="form-floating mb-3">
        <input type="text" class="form-control selected disabled border-2 rounded-0 border-start-0 border-end-0 border-top-0" style="box-shadow: none;" id="Username" placeholder="Enter Username" name="Username" autocomplete="off" required>
        <label for="Username"><i class="fas fa-user"></i> Username</label>
        <div id="nameError" class="text-danger"></div>
    </div>
    

    <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control border-2 rounded-0 border-start-0 border-end-0 border-top-0" style="box-shadow: none;" id="pswd" placeholder="Enter password" name="pswd" autocomplete="off" required>
        <label for="pswd"><i class="fas fa-lock"></i> Password</label>
        <i class="fas fa-eye eye-icon" id="togglePassword" onclick="togglePassword()"></i>
        <div id="passwordError" class="text-danger"></div>
    </div>
        
    <span class="psw mt-5"> <a href="#" class="for">Forgot password?</a></span>   
     
    <button type="submit" onclick="Click(event)" class="btn btn-danger">Login</button>
    
    </div>
       </form>
    
</body>
</html>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <title>New Registration</title>
</head>
<body>
  <div class="container p-4" style="width: 650px;" >
    <h2>User Registration Page</h2>
    <form id="registrationForm" >
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label for="dob">DOB</label>
        <input type="date" id="dob" name="dob" required>
      </div>
      <div class="form-group ">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone No</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
      </div>
      <div class="form-group">
        <label for="adhar">Aadhar Card No</label>
        <input type="text" id="adhar" name="adhar" placeholder="Enter last 4 digits" pattern="\d{4}" required>
      </div>
      <div class="form-group">
        <label for="voter">Voter ID</label>
        <input type="text" id="voter" name="voter" placeholder="Enter last 4 digits" pattern="\d{4}" required>
      </div>
      <div class="form-group">
        <label for="voterImage">Voter ID Image</label>
        <input type="file" id="voterImage" name="voterImage" accept="image/*" required>
      </div>
      <button type="submit" class="button fw-bold">Register button</button>
    </form>
  </div>
</body>
<script src="main.js"></script>
</html>
